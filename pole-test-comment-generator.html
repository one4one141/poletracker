<body>
<div id="app" class="mx-auto flex min-h-full max-w-[480px] flex-col bg-bg"></div>

<script>
// ========== DATA & LOGIC (ported from comment.ts) ==========
const TEST_TYPES = [
  "Stage 1","Stage 1A (Soft)","Stage 1A (Hard)","Stage 2","Stage 3","Incomplete","Pole Recovered"
];

const TEST_LABELS = {
  visual: "Visual", hammer: "Hammer", resistograph: "Resistograph",
  dig: "Dig", climb: "Climb", drillPattern: "Drill Pattern", digType: "Dig Type"
};

const PFN = ["Pass", "Fail", "Not done"];
const TEST_OPTIONS = {
  visual: PFN, hammer: PFN, resistograph: PFN, dig: PFN, climb: PFN,
  drillPattern: ["0-52", ">52", "RA", "TNC"], digType: ["Full", "2/3", "TNC"]
};

const FIELD_CONFIG = {
  "Stage 1": { tests: ["visual"], showTestResult: true, showReason: false, showDrillPattern: false, showDigType: false },
  "Stage 1A (Soft)": { tests: ["visual","hammer","resistograph","dig"], showTestResult: true, showReason: false, showDrillPattern: false, showDigType: false },
  "Stage 1A (Hard)": { tests: ["visual","hammer","resistograph"], showTestResult: true, showReason: false, showDrillPattern: false, showDigType: false },
  "Stage 2": { tests: ["visual","hammer","resistograph","climb"], showTestResult: true, showReason: false, showDrillPattern: false, showDigType: false },
  "Stage 3": { tests: ["visual","hammer","resistograph","dig","climb"], showTestResult: true, showReason: false, showDrillPattern: true, showDigType: true },
  "Incomplete": { tests: ["visual","hammer","resistograph","dig","climb"], showTestResult: false, showReason: true, showDrillPattern: false, showDigType: false },
  "Pole Recovered": { tests: [], showTestResult: false, showReason: true, showDrillPattern: false, showDigType: false }
};

const STAGE1_PASS = ["OK","Hollow Pole Corroded","Recovery Pole Defective","Hazard","D for Depth","Damage Move","Pole is Damaged","PIDOC (CAT 1)","PIDOC (CAT 2)","Danger of Collapse (CAT 3)","Pole Unstable"];
const STAGE1_OTHER = STAGE1_PASS.filter(o => o !== "OK" && o !== "Hazard");
const DEFAULT_RESULTS = ["Pole Decayed","Tested Not Climbed","Shallow Depth","Recovery Pole Defective","D for Depth","Unable to Repair Pole","Damage Move","PIDOC (CAT 1)","PIDOC (CAT 2)","Danger of Collapse (CAT 3)","Pole Dam Repair Poss","Pole Unstable"];

const REASON_OPTIONS = {
  "Incomplete": ["No Access - A108 Left","No Access - A108 Not Left","Tree Cutting Required","Traffic Lights Required","Tree and Traffic Required","Safety Issue","Low Wires","Other"],
  "Pole Recovered": ["Pole no longer exists","Pole is being renumbered"]
};

const SATURN = ["A","B","C","RT"];
const COUNTS = ["0","1","2","3","4","5+"];

function ta(key, label, optional=false){ return {key,label,kind:"textarea",optional}; }
function num(key, label, unit="mm"){ return {key,label,kind:"number",unit}; }
function sel(key, label, options){ return {key,label,kind:"select",options}; }
function txt(key, label, optional=false){ return {key,label,kind:"text",optional}; }

function requiredTestKeys(testType){
  const cfg = FIELD_CONFIG[testType];
  const keys = [...cfg.tests];
  if(cfg.showDrillPattern) keys.push("drillPattern");
  if(cfg.showDigType) keys.push("digType");
  return keys;
}

function allTestsPassed(testType, tests){
  const cfg = FIELD_CONFIG[testType];
  if(!cfg.tests.length) return false;
  return cfg.tests.every(t => tests[t] === "Pass");
}

function resultOptions(testType, tests){
  let opts;
  if(testType === "Stage 1"){
    opts = tests.visual === "Pass" ? [...STAGE1_PASS] : [...STAGE1_OTHER];
  } else {
    opts = [...DEFAULT_RESULTS];
  }
  if(allTestsPassed(testType, tests)){
    if(!opts.includes("OK")) opts.unshift("OK");
  } else {
    opts = opts.filter(o => o !== "OK");
  }
  return opts;
}

function extraSections(testType, result, reason, extras){
  if(testType === "Incomplete"){
    if(reason === "No Access - A108 Left" || reason === "No Access - A108 Not Left"){
      return [{type:"fields", fields:[
        {key:"visit1",label:"Visit 1",kind:"date"},
        {key:"visit2",label:"Visit 2",kind:"date"},
        {key:"visit3",label:"Visit 3",kind:"date"},
        txt("noAccessId","No access submission ID"),
        ta("details","Details")
      ]}];
    }
    if(reason === "Tree Cutting Required" || reason === "Tree and Traffic Required"){
      return [{type:"fields", fields:[txt("a55","A55 Ref(s)"), txt("ptw","PTW Ref",true)]}];
    }
    if(reason === "Traffic Lights Required"){
      return [{type:"fields", fields:[txt("a55","A55 Ref(s)")]}];
    }
    if(reason === "Safety Issue" || reason === "Other"){
      return [{type:"fields", fields:[ta("details","Details")]}];
    }
    if(reason === "Low Wires"){
      return [{type:"fields", fields:[
        txt("a1024","A1024 Ref"),
        sel("lowDropwires","No. Low Dropwires",COUNTS),
        sel("lowAerial","No. Low Aerial Cables",COUNTS)
      ]}];
    }
    return [];
  }

  if(!result || testType === "Pole Recovered") return [];

  if(result === "Hollow Pole Corroded" || result === "Pole is Damaged" || result === "Pole Dam Repair Poss"){
    return [{type:"fields", fields:[ta("details","Details")]}];
  }
  if(result === "Recovery Pole Defective"){
    return [{type:"fields", fields:[ta("whyDefective","Why is the pole defective?"), ta("whyRecovered","Why does the pole need recovered?")]}];
  }
  if(result === "D for Depth"){
    const fields = [{key:"markVisible",label:"Is the 3m mark visible?",kind:"radio",options:["Yes","No"]}];
    if(extras.markVisible === "Yes") fields.push(num("markHeight","3m mark height","cm"));
    return [{type:"fields", fields}];
  }
  if(result === "Shallow Depth"){
    return [{type:"fields", fields:[num("markHeight","3m mark height","cm")]}];
  }
  if(result === "Tested Not Climbed"){
    const fields = [sel("tncReason","Reason",["Only Sample Test Possible","Pole Top Congestion","Power Conflict","Other"])];
    if(extras.tncReason) fields.push(ta("details","Details"));
    if(extras.tncReason === "Power Conflict") fields.push(txt("a1024","A1024 Ref"));
    return [{type:"fields", fields}];
  }
  if(result === "Unable to Repair Pole"){
    const fields = [sel("unableReason","Reason",["Damage exceeds allowed measurements","Woodpecker damage","Other"])];
    if(extras.unableReason === "Damage exceeds allowed measurements"){
      fields.push(num("circumference","Pole Circumference"), num("sectorC","Sector C (5mm - 10mm)"), num("sectorB","Sector B (11mm - 15mm)"), num("sectorA","Sector A (16mm - 30mm)"));
    } else if(extras.unableReason === "Woodpecker damage" || extras.unableReason === "Other"){
      fields.push(ta("details","Details"));
    }
    fields.push(sel("saturn","Saturn Result",SATURN));
    return [{type:"fields", fields}];
  }
  if(result === "Damage Move"){
    const sections = [{type:"fields", fields:[sel("dmoPossible","Is a full or TNC dig and resi test possible?",["Yes","No"])]}];
    if(extras.dmoPossible === "Yes"){
      sections.push({type:"note", text:"Do not proceed. This is not DMO."});
    } else if(extras.dmoPossible === "No"){
      sections.push({type:"fields", fields:[ta("obstruction","Provide details about the obstruction(s)"), ta("otherComments","Any other comments?",true)]});
    }
    return sections;
  }
  if(result === "PIDOC (CAT 1)" || result === "PIDOC (CAT 2)" || result === "Danger of Collapse (CAT 3)"){
    return [{type:"fields", fields:[ta("whyPidoc","Why is the pole a PIDOC?")]}];
  }
  if(result === "Pole Unstable"){
    return [{type:"fields", fields:[
      sel("unstableDetails","Details",["Unstable Ground","Pole leaning > 15 degrees","Other"]),
      ta("unstableReason","Reason")
    ]}];
  }
  if(result === "Hazard"){
    return [{type:"fields", fields:[
      sel("hazardReason","Reason",["Spiked metal railings","Glass topped walls","Razor wire","Chestnut paling fencing","Proximity to power","Plant close to power","Other"]),
      ta("details","Details")
    ]}];
  }
  if(result === "Pole Decayed"){
    const sections = [{type:"fields", fields:[
      sel("poleClass","Pole Class",["Light or Extra Light","Medium","Stout"]),
      sel("decayType","Decay Type",["Internal","External","Internal & External","Tip Rot","Cross Arms"])
    ]}];
    const dt = extras.decayType;
    if(dt === "External" || dt === "Internal & External"){
      sections.push({type:"fields", fields:[
        num("depth615","Depth (>6mm - 15mm)"),
        num("depth1530","Depth (>15mm - 30mm)"),
        num("depth30","Depth (>30mm)")
      ]});
      sections.push({type:"checks", key:"location", label:"Location", options:["BGL","ATGL","ABGL"]});
    } else if(dt === "Internal"){
      sections.push({type:"checks", key:"location", label:"Location", options:["BGL","ATGL","ABGL"]});
    }
    sections.push({type:"fields", fields:[sel("saturn","Saturn Result",SATURN)]});
    return sections;
  }
  return [];
}

function visibleFields(sections){
  return sections.flatMap(s => s.type === "fields" ? s.fields : []);
}

function up(v){ return (v||"").trim().toUpperCase(); }

function buildComment(data){
  const {testType, extras, locations} = data;
  const parts = [];
  const prefix = {
    "Stage 1":"STAGE 1.","Stage 1A (Soft)":"STAGE 1A (SOFT).","Stage 1A (Hard)":"STAGE 1A (HARD).",
    "Stage 2":"STAGE 2.","Stage 3":"STAGE 3.","Incomplete":"INCOMPLETE.","Pole Recovered":"POLE RECOVERED."
  };
  parts.push(prefix[testType]);
  const result = data.testResult || "";
  const reason = data.reason || "";

  if(testType === "Pole Recovered"){
    if(reason === "Pole no longer exists") parts.push("POLE NO LONGER EXISTS.");
    else if(reason === "Pole is being renumbered") parts.push("POLE IS BEING RENUMBERED.");
    else if(reason) parts.push(up(reason)+".");
    return parts.join(" ").trim();
  }

  const pushTests = (keys) => {
    const bits = [];
    const words = {visual:"VISUAL",hammer:"HAMMER",resistograph:"RESISTOGRAPH",dig:"DIG",climb:"CLIMB",drillPattern:"DRILL PATTERN",digType:"DIG TYPE"};
    for(const k of keys){
      const v = data.tests[k];
      if(v) bits.push(`${words[k]} ${v.toUpperCase()}`);
    }
    if(bits.length) parts.push(bits.join(". ")+".");
  };

  if(testType === "Incomplete"){
    if(reason) parts.push(up(reason)+".");
    if(extras.visit1) parts.push("VISIT 1: "+extras.visit1+".");
    if(extras.visit2) parts.push("VISIT 2: "+extras.visit2+".");
    if(extras.visit3) parts.push("VISIT 3: "+extras.visit3+".");
    if(extras.noAccessId) parts.push("NO ACCESS ID: "+up(extras.noAccessId)+".");
    if(extras.a55) parts.push("A55 REF: "+up(extras.a55)+".");
    if(extras.ptw) parts.push("PTW REF: "+up(extras.ptw)+".");
    if(extras.a1024) parts.push("A1024 REF: "+up(extras.a1024)+".");
    if(extras.lowDropwires) parts.push("LOW DROPWIRES: "+extras.lowDropwires+".");
    if(extras.lowAerial) parts.push("LOW AERIAL CABLES: "+extras.lowAerial+".");
    if(extras.details) parts.push(up(extras.details)+".");
    pushTests(["visual","hammer","resistograph","dig","climb"]);
    return parts.join(" ").replace(/\s+/g," ").replace(/\.\s*\./g,".").trim();
  }

  if(result === "OK"){
    parts.push("OK.");
  } else if(result === "Hollow Pole Corroded"){
    parts.push("HOLLOW POLE CORRODED.");
    if(extras.details) parts.push(up(extras.details)+".");
  } else if(result === "Pole is Damaged"){
    parts.push("POLE IS DAMAGED.");
    if(extras.details) parts.push(up(extras.details)+".");
  } else if(result === "Recovery Pole Defective"){
    parts.push("RECOVERY POLE DEFECTIVE.");
    if(extras.whyDefective) parts.push(up(extras.whyDefective)+".");
    if(extras.whyRecovered) parts.push(up(extras.whyRecovered)+".");
  } else if(result === "Hazard"){
    parts.push("HAZARD.");
    if(extras.hazardReason) parts.push(up(extras.hazardReason)+".");
    if(extras.details) parts.push(up(extras.details)+".");
  } else if(result === "D for Depth"){
    parts.push("D FOR DEPTH.");
    if(extras.markVisible) parts.push("3M MARK VISIBLE: "+up(extras.markVisible)+".");
    if(extras.markHeight) parts.push("3M MARK HEIGHT "+extras.markHeight+" CM.");
  } else if(result === "PIDOC (CAT 1)" || result === "PIDOC (CAT 2)" || result === "Danger of Collapse (CAT 3)"){
    parts.push(up(result)+".");
    if(extras.whyPidoc) parts.push(up(extras.whyPidoc)+".");
  } else if(result === "Pole Unstable"){
    parts.push("POLE UNSTABLE.");
    if(extras.unstableDetails) parts.push(up(extras.unstableDetails)+".");
    if(extras.unstableReason) parts.push(up(extras.unstableReason)+".");
  } else if(result === "Pole Decayed"){
    parts.push("POLE DECAYED.");
    if(extras.poleClass) parts.push("POLE CLASS: "+up(extras.poleClass)+".");
    if(extras.decayType) parts.push("DECAY TYPE: "+up(extras.decayType)+".");
    if(extras.depth615) parts.push("DEPTH >6-15MM: "+extras.depth615+"MM.");
    if(extras.depth1530) parts.push("DEPTH >15-30MM: "+extras.depth1530+"MM.");
    if(extras.depth30) parts.push("DEPTH >30MM: "+extras.depth30+"MM.");
    if(locations.length) parts.push("LOCATION: "+locations.join(", ")+".");
    if(extras.saturn) parts.push("SATURN: "+extras.saturn+".");
  } else if(result === "Tested Not Climbed"){
    parts.push("TESTED NOT CLIMBED.");
    if(extras.tncReason) parts.push(up(extras.tncReason)+".");
    if(extras.details) parts.push(up(extras.details)+".");
    if(extras.a1024) parts.push("A1024 REF: "+up(extras.a1024)+".");
  } else if(result === "Shallow Depth"){
    parts.push("SHALLOW DEPTH.");
    if(extras.markHeight) parts.push("3M MARK HEIGHT "+extras.markHeight+" CM.");
  } else if(result === "Unable to Repair Pole"){
    parts.push("UNABLE TO REPAIR POLE.");
    if(extras.unableReason) parts.push(up(extras.unableReason)+".");
    if(extras.circumference) parts.push("CIRCUMFERENCE: "+extras.circumference+" MM.");
    if(extras.sectorC) parts.push("SECTOR C: "+extras.sectorC+" MM.");
    if(extras.sectorB) parts.push("SECTOR B: "+extras.sectorB+" MM.");
    if(extras.sectorA) parts.push("SECTOR A: "+extras.sectorA+" MM.");
    if(extras.details) parts.push(up(extras.details)+".");
    if(extras.saturn) parts.push("SATURN: "+extras.saturn+".");
  } else if(result === "Pole Dam Repair Poss"){
    parts.push("POLE DAM REPAIR POSS.");
    if(extras.details) parts.push(up(extras.details)+".");
  } else if(result === "Damage Move"){
    parts.push("DAMAGE MOVE.");
    if(extras.dmoPossible) parts.push("FULL/TNC DIG POSSIBLE: "+up(extras.dmoPossible)+".");
    if(extras.obstruction) parts.push("OBSTRUCTION: "+up(extras.obstruction)+".");
    if(extras.otherComments) parts.push(up(extras.otherComments)+".");
  } else if(result){
    parts.push(up(result)+".");
  }

  pushTests(["visual","hammer","resistograph","drillPattern","dig","digType","climb"]);
  return parts.join(" ").replace(/\s+/g," ").replace(/\.\s*\./g,".").trim();
}

function validate(data){
  if(!data.testType) return "Please select a Test Type.";
  const missing = requiredTestKeys(data.testType).filter(k => !data.tests[k]);
  if(missing.length){
    const names = missing.map(k => TEST_LABELS[k]);
    return names.length === 1 ? `Please select a result for: ${names[0]}` : `Please select a result for: ${names.join(", ")}`;
  }
  const cfg = FIELD_CONFIG[data.testType];
  if(cfg.showTestResult && !data.testResult) return "Please select a Test Result.";
  if(cfg.showReason && !data.reason) return "Please select a Reason.";

  const sections = extraSections(data.testType, data.testResult, data.reason, data.extras);
  if(sections.some(s => s.type === "note")) return "Do not proceed. This is not DMO.";

  const empty = visibleFields(sections)
    .filter(f => !f.optional && !String(data.extras[f.key]||"").trim())
    .map(f => f.label);
  const needsLoc = sections.some(s => s.type === "checks");
  if(needsLoc && data.locations.length === 0) empty.push("Location");
  if(empty.length){
    const unique = [...new Set(empty)];
    return unique.length === 1 ? `Please enter text in: ${unique[0]}` : `Please enter text in: ${unique.join(", ")}`;
  }
  return null;
}

// ========== UI STATE & RENDER ==========
const state = {
  pref: localStorage.getItem("ptcg-theme") || "system",
  settings: false,
  testType: "",
  tests: {},
  testResult: "",
  reason: "",
  extras: {},
  locations: [],
  comment: "",
  commentOpen: false,
  toast: null,
  copied: false,
  lastSectionKey: ""
};

function applyTheme(p){
  const t = p === "system"
    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : p;
  document.documentElement.setAttribute("data-theme", t);
}

function chooseTheme(p){
  localStorage.setItem("ptcg-theme", p);
  state.pref = p;
  applyTheme(p);
  render();
}

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if(state.pref === "system") applyTheme("system");
});

function pillTone(value, selected){
  if(!selected) return "border-transparent bg-pill text-muted";
  if(value === "Pass") return "border-pass-bd bg-pass-bg text-pass-fg font-semibold";
  if(value === "Fail") return "border-fail-bd bg-fail-bg text-fail-fg font-semibold";
  if(value === "Not done") return "border-skip-bd bg-skip-bg text-skip-fg font-semibold";
  return "border-primary bg-primary-soft text-primary font-semibold";
}

function showToast(text, warn=false){
  state.toast = {text, warn};
  render();
  setTimeout(() => { state.toast = null; render(); }, warn ? 3400 : 1800);
}

function reset(){
  state.testType = "";
  state.tests = {};
  state.testResult = "";
  state.reason = "";
  state.extras = {};
  state.locations = [];
  state.comment = "";
  state.commentOpen = false;
  render();
}

function onType(next){
  state.testType = next;
  state.tests = {};
  state.testResult = "";
  state.reason = "";
  state.extras = {};
  state.locations = [];
  state.comment = "";
  state.commentOpen = false;
  render();
}

function setTest(key, value){
  state.tests = {...state.tests, [key]: value};
  if(state.testType && FIELD_CONFIG[state.testType].showTestResult){
    const opts = resultOptions(state.testType, state.tests);
    if(state.testResult && !opts.includes(state.testResult)){
      state.testResult = "";
      state.extras = {};
      state.locations = [];
    }
  }
  render();
}

function setExtra(key, value){
  const next = {...state.extras, [key]: value};
  if(key === "markVisible" && value !== "Yes") delete next.markHeight;
  if(key === "tncReason" && value !== "Power Conflict") delete next.a1024;
  if(key === "unableReason"){
    delete next.circumference; delete next.sectorA; delete next.sectorB; delete next.sectorC; delete next.details;
  }
  if(key === "dmoPossible"){
    delete next.obstruction; delete next.otherComments;
  }
  if(key === "decayType"){
    delete next.depth615; delete next.depth1530; delete next.depth30;
    state.locations = [];
  }
  state.extras = next;
  render();
}

function toggleLocation(o){
  if(state.locations.includes(o)) state.locations = state.locations.filter(x => x !== o);
  else state.locations = [...state.locations, o];
  render();
}

function submit(){
  const message = validate({
    testType: state.testType, tests: state.tests, testResult: state.testResult,
    reason: state.reason, extras: state.extras, locations: state.locations
  });
  if(message || !state.testType){
    showToast(message || "Please select a Test Type.", true);
    return;
  }
  state.comment = buildComment({
    testType: state.testType, tests: state.tests, testResult: state.testResult,
    reason: state.reason, extras: state.extras, locations: state.locations
  });
  state.commentOpen = true;
  render();
}

async function copyComment(){
  try{
    await navigator.clipboard.writeText(state.comment);
    state.copied = true;
    render();
    setTimeout(() => { state.copied = false; render(); }, 1600);
  }catch(e){
    showToast("Could not copy", true);
  }
}

function fieldControl(field){
  const value = state.extras[field.key] || "";
  if(field.kind === "textarea"){
    const max = 250;
    const left = max - value.length;
    return `<label class="block">
      <span class="mb-1.5 block text-sm font-semibold">${esc(field.label)}</span>
      <textarea class="field" maxlength="${max}" data-extra="${esc(field.key)}">${esc(value)}</textarea>
      <span class="mt-1 block text-right text-xs text-muted">${left} char(s) remaining</span>
    </label>`;
  }
  if(field.kind === "select"){
    const opts = (field.options||[]).map(o => `<option value="${esc(o)}" ${value===o?"selected":""}>${esc(o)}</option>`).join("");
    return `<label class="block">
      <span class="mb-1.5 block text-sm font-semibold">${esc(field.label)}</span>
      <select class="field" data-extra="${esc(field.key)}"><option value="">— Select —</option>${opts}</select>
    </label>`;
  }
  if(field.kind === "radio"){
    const opts = (field.options||[]).map(o => `
      <label class="flex min-h-11 items-center gap-2 text-[15px] font-medium">
        <input type="radio" name="${esc(field.key)}" class="size-5 accent-[var(--color-primary)]" value="${esc(o)}" ${value===o?"checked":""} data-extra="${esc(field.key)}"/>
        ${esc(o)}
      </label>`).join("");
    return `<fieldset><legend class="mb-1.5 text-sm font-semibold">${esc(field.label)}</legend>
      <div class="flex flex-wrap gap-3">${opts}</div></fieldset>`;
  }
  const type = field.kind === "number" ? "number" : field.kind === "date" ? "date" : "text";
  return `<label class="block">
    <span class="mb-1.5 block text-sm font-semibold">${esc(field.label)}</span>
    <span class="flex items-center gap-2">
      <input class="field" type="${type}" value="${esc(value)}" data-extra="${esc(field.key)}"/>
      ${field.unit ? `<span class="text-sm text-muted">${esc(field.unit)}</span>` : ""}
    </span>
    ${field.key === "ptw" ? `<span class="mt-1 block text-xs text-muted">Leave PTW ref blank for council owned land.</span>` : ""}
  </label>`;
}

function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}


function scrollToNewContent(){
  // After render, scroll so the newest incomplete section is in view
  requestAnimationFrame(() => {
    const main = document.querySelector("main");
    if(!main) return;
    // Prefer scrolling to the extras section if present, else bottom of main content
    const extras = document.getElementById("extras");
    const target = extras || main.lastElementChild;
    if(target){
      target.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else {
      main.scrollTo({ top: main.scrollHeight, behavior: "smooth" });
    }
  });
}

function render(){
  const root = document.getElementById("app");
  const cfg = state.testType ? FIELD_CONFIG[state.testType] : null;
  const keys = state.testType ? requiredTestKeys(state.testType) : [];
  const results = (state.testType && cfg?.showTestResult) ? resultOptions(state.testType, state.tests) : [];
  const sections = state.testType ? extraSections(state.testType, state.testResult, state.reason, state.extras) : [];

  let html = `
  <header class="sticky top-0 z-20 flex items-center justify-between gap-3 bg-navy px-4 py-3.5 text-white">
    <h1 class="text-[15px] font-semibold tracking-tight">Pole Test Comment Generator</h1>
    <button type="button" id="btn-settings" class="flex size-9 items-center justify-center rounded-full bg-white/15" aria-label="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <main class="flex-1 overflow-y-auto px-4 pb-28 pt-4">
  `;

  if(!state.testType){
    html += `
      <p class="mb-3 text-[11px] font-bold uppercase tracking-[0.07em] text-muted">Select test type</p>
      <div class="grid grid-cols-2 gap-2">
        ${TEST_TYPES.map(t => `
          <button type="button" data-type="${esc(t)}" class="min-h-12 rounded-xl border-[1.5px] border-border bg-input px-3 text-left text-sm font-semibold leading-tight text-fg">${esc(t)}</button>
        `).join("")}
      </div>
      <p class="mt-4 text-sm leading-relaxed text-muted">Choose a test type. The other options clear so the tests fill the screen.</p>
    `;
  } else {
    html += `
      <div class="mb-3 flex items-center justify-between gap-3 rounded-xl bg-primary-soft px-3 py-2">
        <div class="min-w-0">
          <p class="text-[11px] font-bold uppercase tracking-[0.07em] text-primary">Test type</p>
          <p class="truncate text-sm font-semibold text-fg">${esc(state.testType)}</p>
        </div>
        <button type="button" id="btn-change-type" class="min-h-10 shrink-0 rounded-full bg-card px-3 text-sm font-semibold text-primary">Change</button>
      </div>
    `;
  }

  if(keys.length > 0){
    html += `
      <section>
        <div class="mb-1 flex items-baseline justify-between">
          <h2 class="text-[11px] font-bold uppercase tracking-[0.07em] text-muted">Tests done</h2>
          <span class="text-xs font-medium text-muted">${keys.filter(k => state.tests[k]).length} of ${keys.length}</span>
        </div>
        ${keys.map(key => `
          <div class="grid grid-cols-[4.6rem_1fr] items-center gap-2 border-b border-border py-1.5 last:border-b-0">
            <span class="text-[13px] font-semibold leading-tight">${esc(TEST_LABELS[key])}</span>
            <div class="grid gap-1 ${TEST_OPTIONS[key].length > 3 ? "grid-cols-4" : "grid-cols-3"}">
              ${TEST_OPTIONS[key].map(opt => {
                const on = state.tests[key] === opt;
                return `<button type="button" data-test="${esc(key)}" data-opt="${esc(opt)}"
                  class="inline-flex min-h-11 items-center justify-center rounded-lg border-[1.5px] px-1 text-center text-[12px] font-medium leading-tight ${pillTone(opt,on)}">${esc(opt)}</button>`;
              }).join("")}
            </div>
          </div>
        `).join("")}
      </section>
    `;
  }

  if(cfg?.showTestResult){
    html += `
      <label class="mt-3.5 block">
        <span class="mb-1.5 block text-sm font-semibold">Test Result</span>
        <select class="field" id="sel-result">
          <option value="">— Select —</option>
          ${results.map(r => `<option value="${esc(r)}" ${state.testResult===r?"selected":""}>${esc(r)}</option>`).join("")}
        </select>
      </label>
    `;
  }

  if(cfg?.showReason){
    const reasons = REASON_OPTIONS[state.testType] || [];
    html += `
      <label class="mt-3.5 block">
        <span class="mb-1.5 block text-sm font-semibold">Reason</span>
        <select class="field" id="sel-reason">
          <option value="">— Select —</option>
          ${reasons.map(r => `<option value="${esc(r)}" ${state.reason===r?"selected":""}>${esc(r)}</option>`).join("")}
        </select>
      </label>
    `;
  }

  if(sections.length > 0){
    html += `<div id="extras" class="mt-3 space-y-3.5 border-t border-border pt-3">`;
    sections.forEach((section, i) => {
      if(section.type === "note"){
        html += `<p class="py-2 text-center text-[15px] font-bold text-danger">${esc(section.text)}</p>`;
      } else if(section.type === "checks"){
        html += `<fieldset>
          <legend class="mb-1.5 text-sm font-semibold">${esc(section.label)}</legend>
          <div class="flex flex-wrap gap-3.5">
            ${section.options.map(o => `
              <label class="flex min-h-11 items-center gap-2 text-[15px] font-medium">
                <input type="checkbox" class="size-5 accent-[var(--color-primary)]" value="${esc(o)}" data-loc="${esc(o)}" ${state.locations.includes(o)?"checked":""}/>
                ${esc(o)}
              </label>
            `).join("")}
          </div>
        </fieldset>`;
      } else if(section.type === "fields"){
        section.fields.forEach(f => { html += fieldControl(f); });
      }
    });
    html += `</div>`;
  }

  // Comment is shown as a popup modal (rendered after footer)

  html += `</main>

  <footer class="fixed bottom-0 left-0 right-0 z-20 mx-auto flex max-w-[480px] gap-2 border-t border-border bg-card px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
    <button type="button" id="btn-reset" class="min-h-12 flex-1 rounded-xl bg-pill text-[15px] font-semibold text-muted">Reset</button>
    <button type="button" id="btn-submit" class="min-h-12 flex-1 rounded-xl bg-primary text-[15px] font-semibold text-navy">Submit</button>
  </footer>
  `;

  if(state.settings){
    html += `
      <div id="settings-overlay" class="fixed inset-0 z-50 flex items-end justify-center bg-navy/45 p-3">
        <div id="settings-panel" class="w-full max-w-[480px] overflow-hidden rounded-[18px] bg-card">
          <div class="flex items-center justify-between bg-navy px-4 py-4 text-white">
            <h2 class="text-base font-semibold">Settings</h2>
            <button type="button" id="btn-close-settings" class="flex size-9 items-center justify-center rounded-full bg-white/15" aria-label="Close">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="p-4 pb-6">
            <p class="mb-2.5 text-xs font-bold uppercase tracking-wider text-muted">Appearance</p>
            <div class="grid grid-cols-3 gap-2">
              ${["light","dark","system"].map(p => `
                <button type="button" data-theme-pref="${p}"
                  class="min-h-12 rounded-xl border-[1.5px] text-sm font-semibold capitalize ${state.pref===p ? "border-primary bg-primary-soft text-primary" : "border-transparent bg-pill text-muted"}">${p}</button>
              `).join("")}
            </div>
            <p class="mt-2 text-xs leading-snug text-muted">System follows your device light or dark setting.</p>
          </div>
        </div>
      </div>
    `;
  }

  if(state.commentOpen && state.comment){
    html += `
      <div id="comment-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-navy/50 p-3">
        <div id="comment-panel" class="w-full max-w-[480px] overflow-hidden rounded-[18px] bg-card shadow-xl">
          <div class="flex items-center justify-between bg-navy px-4 py-4 text-white">
            <h2 class="text-base font-semibold">Generated comment</h2>
            <button type="button" id="btn-close-comment" class="flex size-9 items-center justify-center rounded-full bg-white/15" aria-label="Close">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <div class="max-h-[60vh] overflow-y-auto p-4">
            <p class="text-[15px] font-medium leading-relaxed text-fg break-words whitespace-pre-wrap">${esc(state.comment)}</p>
          </div>
          <div class="flex gap-2 border-t border-border p-3">
            <button type="button" id="btn-close-comment-2" class="min-h-12 flex-1 rounded-xl bg-pill text-[15px] font-semibold text-muted">Close</button>
            <button type="button" id="btn-copy" class="min-h-12 flex-1 rounded-xl bg-primary text-[15px] font-semibold text-navy inline-flex items-center justify-center gap-2">
              ${state.copied
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copy`}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if(state.toast){
    html += `
      <div role="status" class="fixed bottom-24 left-1/2 z-[60] max-w-[min(90vw,360px)] -translate-x-1/2 rounded-3xl px-5 py-3 text-center text-sm font-semibold leading-snug text-white shadow-lg ${state.toast.warn ? "bg-danger" : "bg-navy"}">
        ${esc(state.toast.text)}
      </div>
    `;
  }

  root.innerHTML = html;
  bindEvents();

  // Auto-scroll when a new section appears (after filling previous fields)
  const sectionKey = [
    state.testType || "",
    (state.testType ? requiredTestKeys(state.testType) : []).map(k => state.tests[k] || "").join(","),
    state.testResult || "",
    state.reason || "",
    (state.testType ? extraSections(state.testType, state.testResult, state.reason, state.extras) : [])
      .map(s => s.type === "fields" ? s.fields.map(f => f.key).join(",") : s.type === "checks" ? s.key : "note").join("|"),
    Object.keys(state.extras).sort().map(k => k + ":" + (state.extras[k]||"")).join(";")
  ].join("::");

  if(sectionKey !== state.lastSectionKey && state.testType){
    const prev = state.lastSectionKey;
    state.lastSectionKey = sectionKey;
    // Only scroll when something new was added (not on first paint of type)
    if(prev && prev.split("::")[0] === state.testType){
      scrollToNewContent();
    }
  } else {
    state.lastSectionKey = sectionKey;
  }
}

function bindEvents(){
  document.getElementById("btn-settings")?.addEventListener("click", () => { state.settings = true; render(); });
  document.getElementById("btn-close-settings")?.addEventListener("click", () => { state.settings = false; render(); });
  document.getElementById("settings-overlay")?.addEventListener("click", (e) => {
    if(e.target.id === "settings-overlay"){ state.settings = false; render(); }
  });
  document.querySelectorAll("[data-theme-pref]").forEach(btn => {
    btn.addEventListener("click", () => chooseTheme(btn.dataset.themePref));
  });

  document.querySelectorAll("[data-type]").forEach(btn => {
    btn.addEventListener("click", () => onType(btn.dataset.type));
  });
  document.getElementById("btn-change-type")?.addEventListener("click", () => onType(""));

  document.querySelectorAll("[data-test]").forEach(btn => {
    btn.addEventListener("click", () => setTest(btn.dataset.test, btn.dataset.opt));
  });

  document.getElementById("sel-result")?.addEventListener("change", (e) => {
    state.testResult = e.target.value;
    state.extras = {};
    state.locations = [];
    render();
  });
  document.getElementById("sel-reason")?.addEventListener("change", (e) => {
    state.reason = e.target.value;
    state.extras = {};
    render();
  });

  document.querySelectorAll("[data-extra]").forEach(el => {
    const key = el.dataset.extra;
    if(el.type === "radio"){
      el.addEventListener("change", () => { if(el.checked) setExtra(key, el.value); });
    } else {
      el.addEventListener("input", () => setExtra(key, el.value));
      el.addEventListener("change", () => setExtra(key, el.value));
    }
  });

  document.querySelectorAll("[data-loc]").forEach(el => {
    el.addEventListener("change", () => toggleLocation(el.dataset.loc));
  });

  document.getElementById("btn-reset")?.addEventListener("click", reset);
  document.getElementById("btn-submit")?.addEventListener("click", submit);
  document.getElementById("btn-copy")?.addEventListener("click", copyComment);
  document.getElementById("btn-close-comment")?.addEventListener("click", () => { state.commentOpen = false; state.copied = false; render(); });
  document.getElementById("btn-close-comment-2")?.addEventListener("click", () => { state.commentOpen = false; state.copied = false; render(); });
  document.getElementById("comment-overlay")?.addEventListener("click", (e) => {
    if(e.target.id === "comment-overlay"){ state.commentOpen = false; state.copied = false; render(); }
  });
}

render();
</script>
</body>
</html>
