<!doctype html>
<html lang="en-GB">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Pole Test Tracker</title>
<style>
:root{
  --bg:#ffffff; --card:#f2f2f7; --card2:#e5e5ea; --text:#111; --sub:#6b6b73; --line:#d8d8de;
  --brand:#1a59ad; --brand2:#2e8cd1; --green:#229e47; --orange:#db800d; --red:#d13333; --purple:#8a2be2; --grey:#8e8e93;
  --tab:#f9f9fb; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--text:#f2f2f7;--sub:#9a9aa1;--line:#38383a;--tab:#111113;--brand:#4a90e2;--brand2:#3b9be0;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--text:#f2f2f7;--sub:#9a9aa1;--line:#38383a;--tab:#111113;--brand:#4a90e2;--brand2:#3b9be0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:600px;margin:0 auto;min-height:100vh}
main{padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:30px;margin:6px 0 16px;letter-spacing:-.5px}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--sub)} .small{font-size:12px} .mono{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .grow{flex:1}
.card{background:var(--card);border-radius:14px;padding:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric .v{font-size:20px;font-weight:700;white-space:nowrap}
.metric .t{font-size:12px;color:var(--sub)} .metric .i{font-size:16px;color:var(--brand);height:22px;display:flex;align-items:center}
.hero{width:100%;border:0;border-radius:18px;padding:18px;color:#fff;text-align:left;background:linear-gradient(90deg,var(--brand),var(--brand2));display:flex;align-items:center;gap:14px}
.hero .big{font-size:34px;line-height:1} .hero b{display:block;font-size:17px} .hero span{opacity:.85;font-size:14px}
.link{width:100%;border:0;text-align:left;background:var(--card);border-radius:15px;padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
 a.link{text-decoration:none;color:inherit}
.link .ic{width:42px;height:42px;border-radius:11px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);display:grid;place-items:center;font-size:20px}
.link b{display:block} .link .chev{margin-left:auto;color:var(--sub)}
.banner{background:color-mix(in srgb,var(--orange) 16%,var(--card));border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.banner button{white-space:nowrap}
.btn{border:0;background:var(--card2);border-radius:10px;padding:9px 14px;font-weight:600}

.iconbtn{border:0;background:none;color:var(--brand);font-size:26px;width:44px;height:44px}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--brand)}
.weeknav .c{text-align:center;color:var(--text)} .weeknav .c b{display:block;font-size:17px}
.day{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:13px;margin-bottom:8px;width:100%;border:0;text-align:left}
.day .r{margin-left:auto;text-align:right} .day .clear{border:0;background:none;color:var(--red);padding:6px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--tab) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}

.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:600px;margin:0 auto}
.sheet-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;z-index:2}

label.field{display:block;background:var(--card);border-radius:12px;padding:12px}

input[type=text],input[type=number],input[type=time],input[type=password],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:17px}

.switch{position:relative;width:51px;height:31px;flex:none}

.switch input:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.2s}

.switch.ot input:checked{background:var(--purple)}
.tile{border-radius:12px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:84px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.cell b{font-size:15px} .cell i{font-style:normal;font-size:10px;font-weight:500}
.cell.worked{background:var(--brand2);color:#fff} .cell.ot{background:var(--purple);color:#fff} .cell.off{background:var(--grey);color:#fff}
.cell.today{outline:2px solid var(--text);outline-offset:-2px}
.cell .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.cell.worked .dot,.cell.ot .dot,.cell.off .dot{background:#fff}
.cell.blank{background:none;pointer-events:none}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.sect{background:var(--card);border-radius:14px;padding:4px 14px 8px;margin-bottom:6px}

.sect-f{font-size:13px;color:var(--sub);margin:4px 6px 14px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:568px;margin:0 auto;z-index:60;background:var(--card2);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast button{border:0;background:none;color:var(--brand);font-weight:700}
.menu-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.menu{background:var(--card);width:100%;max-width:600px;border-radius:16px 16px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.paper-wrap{background:var(--card2);border-radius:10px;padding:8px;overflow:hidden}
.paper{background:#fff;color:#111;border-radius:6px;padding:14px;font-size:11px;zoom:.62;width:612px;max-width:none}
.paper *{color:inherit}
.rp h1{font-size:22px;margin:0 0 4px;color:#111} .rp .gr{color:#666}
.rp .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.rp .tile2{background:#f2f2f2;border-radius:8px;padding:8px 10px;min-height:46px}
.rp .tile2 small{display:block;font-size:8px;font-weight:600;color:#666;text-transform:uppercase}
.rp .tile2 b{font-size:16px}
.rp .dayh{background:#1a59ad;color:#fff!important;border-radius:4px;padding:5px 8px;display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-top:12px}
.rp .dayh *{color:#fff!important}
.rp .pill{background:#fff;border-radius:9px;padding:0 8px}
.rp table{width:100%;border-collapse:collapse;margin:6px 0} .rp th{text-align:left;font-size:11px;padding:3px 5px} .rp td{padding:3px 5px;font-size:11px}
.rp tr:nth-child(even) td{background:#f2f2f2}
.rp .sec{break-inside:avoid;page-break-inside:avoid}
.rp .note{font-style:italic;margin:4px 5px}
.rp .foot{margin-top:14px;font-size:9px;color:#666}
svg text{fill:var(--sub);font-size:10px}
.paper svg text{fill:#555}
.hide{display:none!important}
.err{color:var(--red)}
.viewer{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column}
.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
.viewer-bar b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vb{border:0;background:none;color:var(--brand);font-size:17px;padding:8px 10px;text-decoration:none;min-width:56px}
.viewer iframe{flex:1;border:0;width:100%;background:#fff}
.pw-back{position:fixed;inset:0;z-index:160;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.pw-card{background:var(--bg);color:var(--text);border-radius:18px;padding:20px;width:100%;max-width:340px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.pw-card h3{font-size:19px;margin:0 0 4px}.pw-err{color:var(--red);font-size:14px;min-height:20px;margin:8px 0 0}
.pw-card .row{margin-top:12px}.pw-card .btn{flex:1;padding:12px}
@keyframes pwShake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.pw-shake{animation:pwShake .3s}
.gamewrap{position:fixed;inset:0;z-index:200;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gamewrap canvas{display:block;touch-action:none}
.gclose{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:20px;z-index:2}
.egg{display:inline-block;padding:8px 18px;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.gate{position:fixed;inset:0;z-index:100;background:rgba(18,20,26,.6);-webkit-backdrop-filter:grayscale(1) blur(7px);backdrop-filter:grayscale(1) blur(7px);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));overflow:auto}
.gate-card{background:var(--bg);color:var(--text);border-radius:24px;padding:26px 20px 16px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.gate-ic{width:76px;height:76px;border-radius:19px;margin:0 auto 16px;background:linear-gradient(135deg,#1a59ad,#2e8cd1);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(26,89,173,.4)}
.gate-card h2{font-size:22px;margin:0 0 8px;letter-spacing:-.3px}
.gate-card p{margin:0 0 10px;color:var(--sub);font-size:15px}
.gate-warn{background:color-mix(in srgb,var(--orange) 15%,var(--card));border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:left;margin:14px 0 16px;color:var(--text)}
.gate-card .btn.primary{padding:15px;font-size:17px;border-radius:14px}
.gate-skip{display:block;margin:12px auto 0;border:0;background:none;color:var(--sub);font-size:13.5px;text-decoration:underline;padding:8px}
.acc{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc-h{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.acc-ic{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);display:grid;place-items:center;flex:none}
.acc-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acc-ic.red{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.acc-t{flex:1;min-width:0}.acc-t b{display:block;font-size:16px}.acc-t span{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-chev{color:var(--sub);font-size:20px;transition:transform .2s;flex:none}.acc.open .acc-chev{transform:rotate(90deg)}
.acc-b{padding:12px 14px 14px;border-top:1px solid var(--line);animation:accIn .18s ease-out}
@keyframes accIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.acc-note{font-size:13px;color:var(--sub);margin-top:10px}
.updbar{position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:15;background:var(--brand);color:#fff;border-radius:14px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.updbar span{flex:1;font-weight:600;font-size:15px;line-height:1.25} .updbar small{display:block;font-weight:400;opacity:.85;font-size:12px}
.updbar .btn{background:#fff;color:var(--brand);padding:8px 14px} .updbar .x{background:none;border:0;color:#fff;opacity:.8;font-size:20px;padding:4px 6px}
.install{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 16%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);border-radius:16px;padding:14px}
.install .t{display:flex;gap:12px;align-items:flex-start}.install .ic{font-size:28px;line-height:1}
.install .b{display:flex;gap:8px;margin-top:12px}.install .b .btn{flex:1}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px}
ol.steps li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
</style>

<body>
<div id="app"></div>
<input type="file" id="fileIn" accept=".zip,.json,application/zip,application/json" class="hide">

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ config & data */
const APP_VERSION = '2026-11-08.7';   // bump this on every release so installed copies show "update available"
const LS = 'poleTrackerV1';
const WEEK_START_DOW = 4; // JS getDay(): Thursday = 4
// Pole work types and minutes per pole
const TYPES = [
  ['Stage 1',23],['Stage 1A',45],['Stage 2',60],['Stage 3',80],
  ['Request Stage 1A',92],['Request Stage 2',110],['Request Stage 3',130],
  ['Recovered',22],['Modified/Add Record',22],['Incomplete Test',22],
  ['Pole Repaired',120],['PIDOC TNC DEP',42],['Request Test D',114]
].map(([name, minutes]) => ({ name, minutes, countsAsPole: true }));
// Safety net: types no longer offered (or from a short-lived newer version). Days saved with them still open and save correctly.
const LEGACY = [['Total Poles Visit (No Test)', 23], ['Request Test Stage 1', 75], ['Revalidation Stage 1', 23], ['Revalidation Stage 1A', 45], ['Revalidation Stage 2', 60], ['Revalidation Stage 3', 80], ['Recover Stage 1', 23], ['Recover Stage 1A', 45], ['Recover Stage 2', 60], ['Recover Stage 3', 80], ['Asset Validation Stage 1', 23], ['Asset Validation Stage 1A', 45], ['Asset Validation Stage 2', 60], ['Asset Validation Stage 3', 80], ['Add Record', 22], ['Modify Record', 22], ['Pole in danger of Collapse', 42]].map(([name, minutes]) => ({ name, minutes, countsAsPole: true, legacy: true }));
const ALLTYPES = TYPES.concat(LEGACY);
const typeNamed = n => ALLTYPES.find(t => t.name === n);
// Names from that newer version -> the original names (applied to saved data and restored backups)
const RENAME = { 'Periodic Stage 1': 'Stage 1', 'Periodic Stage 1A': 'Stage 1A', 'Periodic Stage 2': 'Stage 2', 'Periodic Stage 3': 'Stage 3', 'Request Test Stage 1A': 'Request Stage 1A', 'Request Test Stage 2': 'Request Stage 2', 'Request Test Stage 3': 'Request Stage 3', 'Pole Recovered': 'Recovered', 'Incomplete': 'Incomplete Test', 'Request Test D Pole': 'Request Test D' };
const canon = n => RENAME[n] || n;

const DEFAULTS = {
  target: 100, amber: 85, lunch: 40, appearance: 'system', reportName: '', reportRoute: '',
  includeComments: true, calcStart: 480, calcEnd: 1020, calcLunch: false,
  reminder: false, reminderMin: 1020, lastBackup: 0, installDismissed: 0
};

let S = load();
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(LS) || 'null');
    if (r && r.days) { Object.values(r.days).forEach(d => (d.activities || []).forEach(a => { a.typeName = canon(a.typeName); })); return { days: r.days, settings: { ...DEFAULTS, ...(r.settings || {}) } }; }
  } catch (e) {}
  return { days: {}, settings: { ...DEFAULTS } };
}
function save() {
  try { localStorage.setItem(LS, JSON.stringify(S)); }
  catch (e) { flash('Could not save: browser storage is full or blocked.'); }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = sod(d); x.setDate(x.getDate() + n); return x; };
const fmt = (d, o) => d.toLocaleDateString('en-GB', o);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); })).toUpperCase();
const hrs = (h, d = 1) => Number(h).toFixed(d);
const pct = p => p == null ? '—' : (p * 100).toFixed(1) + '%';
const target = () => Math.max(1, S.settings.target) / 100;
const amber = () => Math.min(Math.max(0, S.settings.amber) / 100, target());
const perfVar = p => p == null ? 'var(--sub)' : p >= target() ? 'var(--green)' : p >= amber() ? 'var(--orange)' : 'var(--red)';
const perfHex = p => p == null ? '#737373' : p >= target() ? '#219e47' : p >= amber() ? '#db800d' : '#d13333';

/* ------------------------------------------------------------------ day maths */

const rec = date => S.days[dayKey(date)] || null;
const recDate = r => parseKey(r.key);

function weekStart(d) {

}
const weekDates = d => { const s = weekStart(d); return [...Array(7)].map((_, i) => addDays(s, i)); };

  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, limit).map(([n]) => typeNamed(n)).filter(Boolean);
}

/* ------------------------------------------------------------------ charts (inline SVG) */
function barChart(items, h = 150) {
  const W = 340, top = 18, bot = 20, plotH = h - top - bot;
  const vals = items.map(i => i.value).filter(v => v != null);
  const max = Math.max(target() * 1.15, ...vals.map(v => v * 1.1));
  const slot = W / items.length, bw = Math.min(slot * .55, 44);
  const y = v => top + plotH - (v / max) * plotH;
  let s = `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Performance chart">`;
  s += `<line x1="0" x2="${W}" y1="${y(target())}" y2="${y(target())}" stroke="#8e8e93" stroke-dasharray="4 3" stroke-width="1"/>`;
  s += `<text x="${W - 2}" y="${y(target()) - 3}" text-anchor="end" style="font-size:9px">${Math.round(target() * 100)}%</text>`;
  s += `<line x1="0" x2="${W}" y1="${top + plotH}" y2="${top + plotH}" stroke="#8e8e93" stroke-opacity=".5"/>`;
  items.forEach((it, i) => {
    const cx = slot * i + slot / 2;
    if (it.value != null) {
      const bh = Math.max(2, top + plotH - y(it.value));
      s += `<rect x="${cx - bw / 2}" y="${top + plotH - bh}" width="${bw}" height="${bh}" rx="3" fill="${perfHex(it.value)}"/>`;
      s += `<text x="${cx}" y="${top + plotH - bh - 4}" text-anchor="middle" style="font-size:9px;font-weight:700;fill:${perfHex(it.value)}">${(it.value * 100).toFixed(0)}%</text>`;
    }
    s += `<text x="${cx}" y="${h - 6}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return s + '</svg>';
}
function lineChart(points, h = 150) {
  const W = 340, L = 6, R = 6, top = 14, bot = 20, plotH = h - top - bot;
  const vals = points.map(p => p.value);
  const max = Math.max(target() * 1.15, ...vals.map(v => v * 1.05)), min = Math.min(0, ...vals);
  const y = v => top + plotH - ((v - min) / (max - min)) * plotH;
  const x = i => L + (points.length === 1 ? (W - L - R) / 2 : i * ((W - L - R) / (points.length - 1)));
  let s = `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Weekly trend">`;
  s += `<line x1="0" x2="${W}" y1="${y(target())}" y2="${y(target())}" stroke="#8e8e93" stroke-dasharray="4 3"/>`;
  s += `<polyline fill="none" stroke="#2e8cd1" stroke-width="2" points="${points.map((p, i) => `${x(i)},${y(p.value)}`).join(' ')}"/>`;
  points.forEach((p, i) => {
    s += `<circle cx="${x(i)}" cy="${y(p.value)}" r="4" fill="${perfHex(p.value)}"/>`;
    s += `<text x="${x(i)}" y="${h - 6}" text-anchor="middle" style="font-size:9px">${esc(fmt(p.date, { day: 'numeric', month: 'short' }))}</text>`;
  });
  return s + '</svg>';
}

/* ------------------------------------------------------------------ update notice */
let lastUpdCheck = 0;
const pageBase = () => location.href.split('#')[0].split('?')[0];
async function checkUpdate(force) {
  if (!/^https?:$/.test(location.protocol)) return 'local';
  if (navigator.onLine === false) return 'offline';
  if (!force && Date.now() - lastUpdCheck < 15000) return 'skip';
  lastUpdCheck = Date.now();
  try {
    // unique query string + no-store: bypasses the phone's cache, the service worker cache and GitHub's CDN cache
    const r = await fetch(pageBase() + '?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return 'error';
    const m = (await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/);
    if (!m) return 'error';
    V.latest = m[1];
    if (m[1] !== APP_VERSION) { if (!V.update) { V.update = true; render(); } return 'new'; }
    return 'same';
  } catch (e) { return 'error'; }
}
async function applyUpdate() {
  try {
    if (navigator.serviceWorker) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch (e) {}
  location.replace(pageBase() + '?v=' + Date.now());   // a brand-new address forces a fresh download
}

function newEditor(key) {
  const r = S.days[key];
  const e = {
    key, dayOff: r?.isDayOff || false, overtime: r?.isOvertime || false,
    working: r && r.actualHours ? String(r.actualHours) : '', down: r && r.downtimeHours ? String(r.downtimeHours) : '',
    comments: r?.comments || '', qty: {}, tUsed: false
  };
  (r?.activities || []).forEach(a => { e.qty[a.typeName] = (e.qty[a.typeName] || 0) + a.quantity; });
  e.origMin = {}; (r?.activities || []).forEach(a => { if (a.minutesEach != null) e.origMin[a.typeName] = a.minutesEach; });
  e.initial = edSig(e);
  return e;
}
const edSig = e => JSON.stringify([e.dayOff, e.overtime, e.working, e.down, e.comments, e.qty]);
const parseNum = t => { const c = String(t).trim().replace(',', '.'); if (!c) return 0; const n = Number(c); return isNaN(n) ? null : n; };
const minFor = (e, t) => (e.origMin && e.origMin[t.name] != null) ? e.origMin[t.name] : t.minutes;
const edDraftBudget = e => ALLTYPES.reduce((s, t) => s + minFor(e, t) * (e.qty[t.name] || 0) / 60, 0);
const edNet = e => (parseNum(e.working) || 0) - (parseNum(e.down) || 0);
const edPerf = e => { const n = edNet(e); return n > 0 ? edDraftBudget(e) / n : null; };
const edPoles = e => ALLTYPES.reduce((s, t) => s + (t.countsAsPole ? (e.qty[t.name] || 0) : 0), 0);

function needCard(e) {
  const net = edNet(e), tp = Math.round(target() * 100), p = edPerf(e);
  const rem = target() * net * 60 - edDraftBudget(e) * 60;
  let body;
  if (net <= 0) body = `<div class="sub">Enter your working hours above to see how much pole work you need to reach ${tp}%.</div>`;
  else if (rem <= 0.0001) { const ahead = Math.round(-rem); body = `<b style="color:var(--green)">✔ ${ahead >= 1 ? `You've reached ${tp}%, ${ahead} min ahead.` : `You're right on ${tp}%.`}</b>`; }
  else {
    const sug = ['Stage 1A', 'Stage 2', 'Stage 3'].map(typeNamed);
    body = `<div>${Math.ceil(rem)} min of pole work to go to reach ${tp}%.</div>` + sug.map(t => {
      const n = Math.max(1, Math.ceil(rem / t.minutes - 0.000001));
      return `<div class="row" style="margin-top:8px"><b>${n} more ${esc(t.name)}</b><span class="small sub">(${t.minutes} min each)</span></div>`;
    }).join('');
  }
  return `<div class="row between" style="margin-bottom:8px"><h3 style="margin:0">🎯 What do I need?</h3>${p != null ? `<b style="color:${perfVar(p)}">Now ${pct(p)}</b>` : ''}</div>${body}`;
}
function previewCard(e) {

}

function tile(e, t) {

function edAdjust(name, d) {

function edSave() {

function monthData(first) {
  const y = first.getFullYear(), m = first.getMonth();
  const recs = Object.values(S.days).filter(r => { const d = recDate(r); return d.getFullYear() === y && d.getMonth() === m && hasData(r); }).sort((a, b) => a.key < b.key ? -1 : 1);
  const worked = recs.filter(r => !r.isDayOff && (r.actualHours > 0 || r.activities.length));
  const g = {};
  worked.forEach(r => { const k = dayKey(weekStart(recDate(r))); (g[k] ||= []).push(r); });
  const weeks = Object.keys(g).sort().map(k => ({ start: parseKey(k), days: g[k].length, poles: g[k].reduce((s, r) => s + polesOf(r), 0), net: g[k].reduce((s, r) => s + netH(r), 0), budget: g[k].reduce((s, r) => s + budgetH(r), 0) }))
    .map(w => ({ ...w, perf: w.net > 0 ? w.budget / w.net : null }));
  const q = {}, b = {};
  worked.forEach(r => r.activities.forEach(a => { q[a.typeName] = (q[a.typeName] || 0) + a.quantity; b[a.typeName] = (b[a.typeName] || 0) + actBudget(a); }));
  const acts = Object.keys(q).map(n => ({ name: n, qty: q[n], budget: b[n] })).sort((a, b2) => b2.budget - a.budget);
  const net = worked.reduce((s, r) => s + netH(r), 0), budget = worked.reduce((s, r) => s + budgetH(r), 0);
  const withPerf = weeks.filter(w => w.perf != null), dayPerf = worked.filter(r => perfOf(r) != null);
  return {
    month: first, title: fmt(first, { month: 'long', year: 'numeric' }), recs, worked, daysOff: recs.filter(r => r.isDayOff).length, weeks, acts,
    ot: recs.filter(r => r.isOvertime && !r.isDayOff), notes: recs.filter(r => r.comments),
    poles: worked.reduce((s, r) => s + polesOf(r), 0), hours: worked.reduce((s, r) => s + r.actualHours, 0), net, budget, perf: net > 0 ? budget / net : null,
    bestWeek: withPerf.slice().sort((a, c) => c.perf - a.perf)[0], worstWeek: withPerf.slice().sort((a, c) => a.perf - c.perf)[0],
    bestDay: dayPerf.slice().sort((a, c) => perfOf(c) - perfOf(a))[0], worstDay: dayPerf.slice().sort((a, c) => perfOf(a) - perfOf(c))[0],
    isEmpty: recs.length === 0
  };
}

/* -------- export views */
function weekIssues(date) {
  const t = today(), out = [];
  weekDates(date).forEach(d => {
    if (d > t) return;
    const r = rec(d);
    if (!hasData(r)) { out.push({ d, m: 'Nothing entered' }); return; }
    if (r.isDayOff) return;
    if (r.actualHours > 0 && !r.activities.length) out.push({ d, m: 'Hours entered but no pole work' });
    else if (r.actualHours === 0 && r.activities.length) out.push({ d, m: 'Pole work entered but no working hours' });
    else if (r.actualHours > 0 && netH(r) <= 0) out.push({ d, m: 'Downtime equals all working hours' });
  });
  return out;
}

  if (Date.now() - lastLong < 350) return;
  const d = el.dataset, a = d.act;
  switch (a) {
    case 'app-update': { el.disabled = true; el.textContent = 'Updating…'; applyUpdate(); break; }
    case 'egg': { const now = Date.now(); eggN = (now - eggT < 1500) ? eggN + 1 : 1; eggT = now; if (eggN >= 3) { eggN = 0; Game.open(); } break; }
    case 'dmo': askDmoPassword(); break;
    case 'sec-toggle': { V.setOpen = V.setOpen === d.sec ? null : d.sec; V.calcCopied = V.calcApplied = false; render(); if (V.setOpen) { const h = document.getElementById('acc-' + V.setOpen); if (h && h.scrollIntoView) h.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } break; }
    case 'check-update': {
      V.updMsg = 'Checking…'; render();
      checkUpdate(true).then(r => {
        V.updMsg = ({ new: 'A new version is available. Tap Update now.', same: "You're on the latest version.", offline: "You're offline. Connect to the internet and try again.", local: 'Updates are checked when the app is opened from its web address.', error: "Couldn't check just now. Please try again in a moment." })[r] || '';
        render();
      });
      break; }
    case 'app-update-dismiss': V.updDismissed = true; render(); break;
    case 'install-help': V.installHelp = true; render(); break;
    case 'copy-link': { const u = location.href.split('#')[0]; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => flash('Link copied. Paste it into Safari.')).catch(() => prompt('Copy this link and open it in Safari:', u)); break; }
    case 'install-close': V.installHelp = false; render(); break;
    case 'gate-skip': V.gateSkipped = true; render(); break;
    case 'install-now': if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); } else { V.installHelp = true; render(); } break;
    case 'tab': V.tab = d.tab; V.sub = null; window.scrollTo(0, 0); render(); break;
    case 'enter-today': openEditor(dayKey(today())); break;
    case 'edit': openEditor(d.key); break;
    case 'week': V.weekDate = addDays(weekStart(V.weekDate), 7 * Number(d.n)); render(); break;
    case 'week-today': V.weekDate = new Date(); render(); break;
    case 'xweek': V.exportDate = addDays(weekStart(V.exportDate), 7 * Number(d.n)); render(); break;
    case 'month': V.month = new Date(V.month.getFullYear(), V.month.getMonth() + Number(d.n), 1); render(); break;
    case 'month-today': V.month = new Date(today().getFullYear(), today().getMonth(), 1); render(); break;
    case 'clear': {
      const r = S.days[d.key]; if (!r) break;
      if (confirm(`Clear ${fmt(parseKey(d.key), { weekday: 'long', day: 'numeric', month: 'long' })}?\n\nThis removes the hours, pole work and comments for this day. You can undo it for a few seconds afterwards.`)) { deleteDay(d.key); render(); }
      break; }
    case 'undo': undoDelete(); break;
    case 'diary-day': { const r = S.days[d.key]; V.diaryDay = { key: d.key, overtime: r?.isOvertime || false, notes: r?.comments || '' }; render(); break; }
    case 'diary-cancel': V.diaryDay = null; render(); break;
    case 'diary-save': { const dd = V.diaryDay; setDiary(dd.key, dd.overtime, dd.notes.trim() || null); V.diaryDay = null; render(); break; }
    case 'diary-edit': { const dd = V.diaryDay; setDiary(dd.key, dd.overtime, dd.notes.trim() || null); V.diaryDay = null; openEditor(dd.key); break; }
    case 'tile': edAdjust(d.name, 1); break;
    case 'add': edAdjust(d.name, Number(d.n)); if (d.close) { V.menu = null; render(); } break;
    case 'menu-close': if (el.classList.contains('menu-back') && ev.target !== el) break; V.menu = null; render(); break;
    case 'copy-prev': { const p = S.days[d.key]; V.editor.qty = {}; p.activities.forEach(x => { if (typeNamed(x.typeName)) V.editor.qty[x.typeName] = (V.editor.qty[x.typeName] || 0) + x.quantity; }); render(); break; }
    case 'use-times': { const h = tHours() / 60; V.editor.working = String(Math.round(h * 100) / 100); V.editor.tUsed = true; render(); break; }
    case 'ed-cancel': edCancel(); break;
    case 'ed-save': edSave(); break;
    case 'ed-delete': if (confirm("Delete this day's entry?")) { deleteDay(V.editor.key); V.editor = null; render(); } break;
    case 'pdf-week': try { savePdf(pdfWeek(V.exportDate, S.settings.includeComments), `PolePerformance-Week-${dayKey(weekStart(V.exportDate))}.pdf`); } catch (e) { alert('Could not create the PDF: ' + (e && e.message || e)); } break;
    case 'pdf-month': try { savePdf(pdfMonth(monthData(V.month), S.settings.includeComments), `PolePerformance-Month-${V.month.getFullYear()}-${pad(V.month.getMonth() + 1)}.pdf`); } catch (e) { alert('Could not create the PDF: ' + (e && e.message || e)); } break;
    case 'monthly': V.sub = 'monthly'; window.scrollTo(0, 0); render(); break;
    case 'back-export': V.sub = null; render(); break;
    case 'calc-copy': { const t = hrs(tHours() / 60, 2); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => {}); V.calcCopied = true; render(); break; }
    case 'calc-today': {
      const k = dayKey(today()), r = S.days[k], h = tHours() / 60;
      if (r && (r.isDayOff || r.actualHours > 0)) {
        const msg = r.isDayOff ? `Today is marked as a day off. Replace it with ${hrs(h, 2)} hrs of work?` : `Today currently has ${hrs(r.actualHours, 2)} hrs. Replace with ${hrs(h, 2)} hrs? Pole work, downtime and comments are kept.`;
        if (!confirm(msg)) break;
      }
      setWorkingHours(k, h); V.calcApplied = true; render(); break; }
    case 'reset-targets': S.settings.target = 100; S.settings.amber = 85; save(); render(); break;
    case 'backup': { const f = backupFile(); download(f.name, f); S.settings.lastBackup = Date.now(); save(); render(); break; }
    case 'backup-share': { const f = backupFile(); shareFile(f).then(() => { S.settings.lastBackup = Date.now(); save(); render(); }); break; }
    case 'restore': $('#fileIn').click(); break;
    case 'wipe': if (confirm('Delete ALL data on this device? This cannot be undone.\n\nMake a backup first if you are unsure.') && confirm('Really delete everything?')) { S.days = {}; save(); render(); } break;
  }
});

/* long-press on pole tiles opens "Add 5 / Add 10 / Remove all" */
let lpTimer = null;
document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('[data-act="tile"]'); if (!el) return;
  lpTimer = setTimeout(() => { lastLong = Date.now(); V.menu = { name: el.dataset.name }; render(); }, 500);
});
['pointerup', 'pointercancel', 'pointermove', 'scroll'].forEach(t => document.addEventListener(t, () => { clearTimeout(lpTimer); }, { passive: true }));
document.addEventListener('contextmenu', ev => { if (ev.target.closest('.tile')) ev.preventDefault(); });

function updateDerived() {
  const e = V.editor; if (!e) return;
  const n = $('#needCard'); if (n) n.innerHTML = needCard(e);
  const p = $('#previewCard'); if (p) p.innerHTML = previewCard(e);
}
document.addEventListener('input', ev => {
  const t = ev.target, id = t.id, e = V.editor;
  if (id === 'edWorking') { e.working = t.value; e.tUsed = false; updateDerived(); }
  else if (id === 'edDown') { e.down = t.value; updateDerived(); }
  else if (id === 'edComments') e.comments = t.value;
  else if (id === 'ddNotes') V.diaryDay.notes = t.value;
  else if (id === 'sName') { S.settings.reportName = t.value; save(); }
  else if (id === 'sRoute') { S.settings.reportRoute = t.value; save(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, id = t.id, s = S.settings;
  switch (id) {
    case 'edOff': V.editor.dayOff = t.checked; render(); break;
    case 'edOT': V.editor.overtime = t.checked; break;
    case 'ddOT': V.diaryDay.overtime = t.checked; break;
    case 'tStart': s.calcStart = toMin(t.value); save(); $('#tOut').textContent = outText(); V.editor.tUsed = false; break;
    case 'tEnd': s.calcEnd = toMin(t.value); save(); $('#tOut').textContent = outText(); V.editor.tUsed = false; break;
    case 'tLunch': s.calcLunch = t.checked; save(); $('#tOut').textContent = outText(); V.editor.tUsed = false; break;
    case 'cStart': s.calcStart = toMin(t.value); save(); V.calcCopied = V.calcApplied = false; render(); break;
    case 'cEnd': s.calcEnd = toMin(t.value); save(); V.calcCopied = V.calcApplied = false; render(); break;
    case 'cLunch': s.calcLunch = t.checked; save(); V.calcCopied = V.calcApplied = false; render(); break;
    case 'xComments': s.includeComments = t.checked; save(); render(); break;
    case 'sTarget': s.target = Math.min(150, Math.max(50, Number(t.value) || 100)); if (s.amber > s.target) s.amber = s.target; save(); render(); break;
    case 'sAmber': s.amber = Math.min(s.target, Math.max(0, Number(t.value) || 0)); save(); render(); break;
    case 'sLunch': s.lunch = Math.min(120, Math.max(0, Number(t.value) || 0)); save(); render(); break;
    case 'rOn': s.reminder = t.checked; save(); render(); break;
    case 'rTime': s.reminderMin = toMin(t.value); save(); break;
    case 'sAppear': s.appearance = t.value; save(); render(); break;
    case 'fileIn': {
      const f = t.files && t.files[0]; if (!f) break;
      f.arrayBuffer().then(async buf => {
        const u = new Uint8Array(buf);
        const text = (u[0] === 0x50 && u[1] === 0x4B) ? await zipFirstJSON(buf) : new TextDecoder().decode(buf);
        const n = importJSON(text); t.value = ''; flash(`Restored ${n} day${n === 1 ? '' : 's'} from the backup.`);
      }).catch(err => { t.value = ''; alert("That file couldn't be restored: " + (err && err.message || err)); });
      break; }
  }
});
function outText() { const tm = tHours(); return `${Math.floor(tm / 60)}h ${tm % 60}m · ${hrs(tm / 60, 2)} hrs`; }

/* ------------------------------------------------------------------ boot: icon, manifest, service worker */
(function boot() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#1a59ad'); g.addColorStop(1, '#2e8cd1'); x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#fff'; x.fillRect(80, 28, 20, 124); x.fillRect(46, 52, 88, 12); x.fillRect(58, 82, 64, 10);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
    const m = { name: 'Pole Test Tracker', short_name: 'Pole Tracker', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#ffffff', theme_color: '#1a59ad', icons: [{ src: c.toDataURL('image/png'), sizes: '180x180', type: 'image/png' }] };
    const ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.appendChild(ml);
  } catch (e) {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkUpdate(); if (!V.editor && !V.diaryDay) render(); } });
  window.addEventListener('online', () => checkUpdate(true));
  setTimeout(() => checkUpdate(true), 1500);
  window.addEventListener('focus', () => checkUpdate());
  window.addEventListener('pageshow', () => checkUpdate());
  setInterval(() => { if (!document.hidden) checkUpdate(); }, 5 * 60 * 1000);
  try { if (/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
  render();
})();
})();
</script>
